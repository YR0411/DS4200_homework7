<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Basque style cheesecake with a slice cut out" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="520" fill="#f2c94c"/>
  <circle cx="310" cy="110" r="70" fill="#f7dc83"/>
  <!-- counter -->
  <rect y="380" width="400" height="140" fill="#1f5c5a"/>
  <rect y="380" width="400" height="8" fill="#153f3e"/>
  <!-- plate -->
  <ellipse cx="200" cy="420" rx="175" ry="50" fill="#dfe8e5"/>
  <ellipse cx="200" cy="414" rx="175" ry="50" fill="#f6f8f7"/>
  <ellipse cx="200" cy="414" rx="140" ry="36" fill="none" stroke="#cfe0dc" stroke-width="3"/>
  <!-- cake shadow -->
  <ellipse cx="200" cy="408" rx="130" ry="26" fill="#8a4b22" opacity="0.25"/>
  <!-- cake side -->
  <path d="M75 330 L75 385 C75 410 130 425 200 425 C270 425 325 410 325 385 L325 330 Z" fill="#c9884a"/>
  <path d="M75 330 L75 350 C75 372 130 386 200 386 C270 386 325 372 325 350 L325 330 Z" fill="#8a4b22"/>
  <!-- cake top (burnt basque top) -->
  <ellipse cx="200" cy="330" rx="125" ry="40" fill="#6e3a1a"/>
  <ellipse cx="200" cy="328" rx="112" ry="33" fill="#8a4b22"/>
  <ellipse cx="185" cy="322" rx="60" ry="14" fill="#a8693a" opacity="0.7"/>
  <!-- slice cut-out showing creamy inside -->
  <path d="M200 330 L318 345 C322 360 322 372 322 385 L200 400 Z" fill="#f6e7c2"/>
  <path d="M200 330 L318 345 L322 385 L200 400 Z" fill="none"/>
  <path d="M200 330 L318 345 C322 360 322 372 322 385 L322 392 L200 408 Z" fill="#f6e7c2"/>
  <path d="M200 330 L318 345" stroke="#8a4b22" stroke-width="4"/>
  <path d="M200 330 L200 408" stroke="#d8c08a" stroke-width="2"/>
  <!-- cracks / texture on top -->
  <g fill="none" stroke="#5a2e14" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M110 325 C125 318 135 320 148 326"/>
    <path d="M230 312 C245 308 258 312 268 320"/>
    <path d="M150 340 C165 345 180 345 195 341"/>
  </g>
  <!-- fork -->
  <g transform="translate(335 440) rotate(-20)" fill="#c9d3d0" stroke="#9fb0ab" stroke-width="1.5">
    <rect x="-3" y="0" width="6" height="55" rx="3"/>
    <rect x="-10" y="-30" width="20" height="26" rx="4"/>
    <line x1="-5" y1="-30" x2="-5" y2="-14"/><line x1="0" y1="-30" x2="0" y2="-14"/><line x1="5" y1="-30" x2="5" y2="-14"/>
  </g>
</svg>
