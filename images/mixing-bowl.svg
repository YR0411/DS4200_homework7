<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mixing bowl with wooden spoon, eggs, and cookies" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="400" fill="#f2c94c"/>
  <!-- table -->
  <rect y="290" width="400" height="110" fill="#1f5c5a"/>
  <rect y="290" width="400" height="6" fill="#153f3e"/>
  <!-- bowl shadow -->
  <ellipse cx="170" cy="338" rx="125" ry="16" fill="#153f3e" opacity="0.5"/>
  <!-- bowl -->
  <path d="M45 190 L295 190 C295 280 245 335 170 335 C95 335 45 280 45 190 Z" fill="#f6f8f7"/>
  <path d="M45 190 L295 190 C295 200 294 210 292 220 L48 220 C46 210 45 200 45 190 Z" fill="#cfe0dc"/>
  <path d="M60 235 C80 285 120 318 170 318" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="170" cy="190" rx="125" ry="22" fill="#e8c88a"/>
  <ellipse cx="170" cy="190" rx="125" ry="22" fill="none" stroke="#f6f8f7" stroke-width="6"/>
  <!-- dough swirl -->
  <path d="M110 190 C130 182 150 198 170 190 C190 182 210 198 230 190" fill="none" stroke="#c99a52" stroke-width="3" stroke-linecap="round"/>
  <!-- wooden spoon -->
  <g transform="rotate(28 250 150)">
    <rect x="244" y="40" width="12" height="150" rx="6" fill="#a8693a"/>
    <ellipse cx="250" cy="30" rx="20" ry="30" fill="#c78a56"/>
    <ellipse cx="250" cy="30" rx="12" ry="20" fill="#a8693a" opacity="0.4"/>
  </g>
  <!-- eggs -->
  <g>
    <ellipse cx="318" cy="308" rx="22" ry="28" fill="#f3e3c8" transform="rotate(15 318 308)"/>
    <ellipse cx="311" cy="298" rx="6" ry="9" fill="#ffffff" opacity="0.6" transform="rotate(15 311 298)"/>
    <ellipse cx="358" cy="318" rx="22" ry="28" fill="#e9d2b0" transform="rotate(-10 358 318)"/>
    <ellipse cx="351" cy="308" rx="6" ry="9" fill="#ffffff" opacity="0.5" transform="rotate(-10 351 308)"/>
  </g>
  <!-- plate of cookies -->
  <ellipse cx="320" cy="262" rx="60" ry="12" fill="#f6f8f7" transform="translate(0 -60)"/>
  <ellipse cx="320" cy="258" rx="52" ry="9" fill="#e4eeeb" transform="translate(0 -60)"/>
  <g transform="translate(0 -62)">
    <circle cx="300" cy="248" r="18" fill="#c78a56"/>
    <circle cx="338" cy="250" r="18" fill="#b86b2e"/>
    <circle cx="320" cy="236" r="18" fill="#d38a3f"/>
    <g fill="#4a2a14">
      <circle cx="294" cy="244" r="2.5"/><circle cx="305" cy="252" r="2.5"/>
      <circle cx="333" cy="246" r="2.5"/><circle cx="343" cy="254" r="2.5"/>
      <circle cx="315" cy="232" r="2.5"/><circle cx="326" cy="240" r="2.5"/>
    </g>
  </g>
  <!-- flour sprinkle -->
  <g fill="#fbf7ee" opacity="0.8">
    <circle cx="40" cy="350" r="2.5"/><circle cx="70" cy="372" r="2"/><circle cx="25" cy="320" r="2"/>
    <circle cx="120" cy="365" r="2.5"/><circle cx="230" cy="360" r="2"/><circle cx="270" cy="372" r="2.5"/>
  </g>
</svg>
